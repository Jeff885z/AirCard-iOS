name: Build AirCard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh Release

      - name: Verify IPA
        run: |
          unzip -t build/AirCard-iOS.ipa
          ls -lh build/AirCard-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS
          path: build/AirCard-iOS.ipa
          if-no-files-found: error
